name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cml-memoryhive-backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: cml-memoryhive-backend/uv.lock
      - run: uv sync --extra dev --locked
      - run: uv run ruff check app tests
      - run: uv run black --check app tests
      - run: uv run pytest -q -m 'not integration'
      - run: uv run python scripts/run_ai_evaluations.py --output evaluation-results/offline-ci.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-offline-evaluation
          path: cml-memoryhive-backend/evaluation-results/offline-ci.json

  temporal-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@v10
        with: { version: '0.12.13', python-version: '3.14', enable-cache: true }
      - run: uv sync --locked
      - run: cp .env.example .env
      - name: Run real Temporal acceptance and failure suite
        run: npm --prefix cml-memoryhive-automation run test -- --temporal --cleanup --skip-seed --skip-web --skip-mobile
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temporal-acceptance-artifacts
          path: cml-memoryhive-backend/evaluation-results/

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cml-memoryhive-frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: cml-memoryhive-frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cml-memoryhive-mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: cml-memoryhive-mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform web
      - run: npm run store:submission:check
      - run: npm run store:check:ci

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f cml-memoryhive-build/runtime/docker-compose.production.yml config --quiet
      - run: sh -n ops/*.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: cml-memoryhive-backend
          target: production
          push: false
          tags: docker.io/maheshk172/cml-memoryhive-backend:ci
          cache-from: type=gha,scope=cml-memoryhive-backend
          cache-to: type=gha,mode=max,scope=cml-memoryhive-backend
      - uses: docker/build-push-action@v7
        with:
          context: cml-memoryhive-frontend
          target: production
          push: false
          tags: docker.io/maheshk172/cml-memoryhive-frontend:ci
          build-args: |
            VITE_API_URL=/api/v1
            VITE_SUPPORT_EMAIL=support@memoryhive.example.com
          cache-from: type=gha,scope=cml-memoryhive-frontend
          cache-to: type=gha,mode=max,scope=cml-memoryhive-frontend

  deployment-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: cml-memoryhive-automation/package-lock.json }
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.12.13", python-version: "3.14", enable-cache: true }
      - run: uv sync --locked
      - uses: azure/setup-kubectl@v5
      - run: uv run python -m py_compile cml-memoryhive-build/build/scripts/*.py cml-memoryhive-deployments/scripts/*.py cml-memoryhive-build/health_checker/*.py
      - run: node --check cml-memoryhive-automation/scripts/run.mjs
      - run: npm --prefix cml-memoryhive-automation run dry-run
      - run: uv run python scripts/generate_knowledge.py --check
      - run: uv run python scripts/validate_ai_rollout.py
      - run: uv run python cml-memoryhive-build/build/scripts/generate_image_manifest.py --version ci --sha ${{ github.sha }} --output /tmp/image-versions.json
      - run: uv run python cml-memoryhive-build/build/scripts/build_images.py --version ci --sha ${{ github.sha }} --dry-run
      - run: uv run python -m unittest discover -s cml-memoryhive-build/tests -p 'test_*.py'
      - name: Validate Prometheus alerts and synthetic drills
        run: |
          docker run --rm -v "$PWD/ops:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/ops:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.14.0 test rules /etc/prometheus/tests/alerts.test.yml
      - name: Validate Alertmanager routing
        run: docker run --rm -v "$PWD/ops:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.30.1 check-config /etc/alertmanager/alertmanager.yml
      - run: uv run python -m unittest discover -s cml-memoryhive-deployments/tests -p 'test_*.py'
      - run: make -C cml-memoryhive-deployments validate-all
      - run: uv run python scripts/audit_project_naming.py
