name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cml-memoryhive-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.2"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: cml-memoryhive-backend/uv.lock
      - run: uv sync --extra dev --locked
      - run: uv run ruff check app tests
      - run: uv run black --check app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cml-memoryhive-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: cml-memoryhive-frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cml-memoryhive-mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: cml-memoryhive-mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx expo export --platform web
      - run: npm run store:submission:check
      - run: npm run store:check:ci

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f cml-memoryhive-build/runtime/docker-compose.production.yml config --quiet
      - run: sh -n ops/*.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: cml-memoryhive-backend
          target: production
          push: false
          tags: ghcr.io/coding-monkey-labs-client-projects/cml-memoryhive-backend:ci
          cache-from: type=gha,scope=cml-memoryhive-backend
          cache-to: type=gha,mode=max,scope=cml-memoryhive-backend
      - uses: docker/build-push-action@v6
        with:
          context: cml-memoryhive-frontend
          target: production
          push: false
          tags: ghcr.io/coding-monkey-labs-client-projects/cml-memoryhive-frontend:ci
          build-args: |
            VITE_API_URL=/api/v1
            VITE_SUPPORT_EMAIL=support@memoryhive.example.com
          cache-from: type=gha,scope=cml-memoryhive-frontend
          cache-to: type=gha,mode=max,scope=cml-memoryhive-frontend

  deployment-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.7.2", python-version: "3.12", enable-cache: true }
      - run: uv sync --locked
      - uses: azure/setup-kubectl@v4
      - run: uv run python -m py_compile cml-memoryhive-build/build/scripts/*.py cml-memoryhive-deployments/scripts/*.py cml-memoryhive-build/health_checker/*.py
      - run: node --check cml-memoryhive-automation/scripts/run.mjs
      - run: npm --prefix cml-memoryhive-automation run dry-run
      - run: uv run python scripts/generate_knowledge.py --check
      - run: uv run python cml-memoryhive-build/build/scripts/generate_image_manifest.py --version ci --sha ${{ github.sha }} --output /tmp/image-versions.json
      - run: uv run python cml-memoryhive-build/build/scripts/build_images.py --version ci --sha ${{ github.sha }} --dry-run
      - run: uv run python -m unittest discover -s cml-memoryhive-build/tests -p 'test_*.py'
      - run: uv run python -m unittest discover -s cml-memoryhive-deployments/tests -p 'test_*.py'
      - run: make -C cml-memoryhive-deployments validate-all
      - run: uv run python scripts/audit_project_naming.py
