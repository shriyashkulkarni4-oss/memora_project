name: Kubernetes Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment from cml-memoryhive-deployments/config/environments.json"
        required: true
        default: staging
        type: choice
        options: [local, staging, production]
      profile:
        description: "Deployment profile from cml-memoryhive-deployments/config/profiles.json"
        required: true
        default: full
        type: choice
        options: [full, temporal, app-only, infra]
      action:
        description: "Validate renders only, or operate against the configured cluster"
        required: true
        default: validate
        type: choice
        options: [validate, apply, upgrade, status]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m py_compile cml-memoryhive-deployments/scripts/manage.py
      - run: python3 cml-memoryhive-deployments/scripts/manage.py --output /tmp/cml-memoryhive-k8s validate ${{ inputs.environment }} ${{ inputs.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: cml-memoryhive-k8s-${{ inputs.environment }}-${{ inputs.profile }}
          path: /tmp/cml-memoryhive-k8s/${{ inputs.environment }}/${{ inputs.profile }}/cml-memoryhive.yaml

  deploy:
    if: inputs.action != 'validate'
    runs-on: ubuntu-latest
    needs: render
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run deployment action
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python3 cml-memoryhive-deployments/scripts/manage.py ${{ inputs.action }} ${{ inputs.environment }} ${{ inputs.profile }}
