name: Nightly Builds

on:
  # Disabled automatic builds - trigger manually when needed
  # schedule:
  #   # Run every day at 3 AM UTC (1 hour after CML builds)
  #   - cron: '0 3 * * *'
  workflow_dispatch:

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  trigger-build:
    name: Trigger Nightly Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build and push workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-and-push.yml',
              ref: 'main',
              inputs: {
                services: '',
                platforms: '${{ env.PLATFORMS }}'
              }
            });
            console.log('Memoryhive nightly build triggered successfully');

      - name: Generate Summary
        run: |
          echo "## Memoryhive Nightly Build Scheduled" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms**: ${{ env.PLATFORMS }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All memoryhive services will be built and pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the [Actions tab](https://github.com/${{ github.repository }}/actions) for progress." >> "$GITHUB_STEP_SUMMARY"
