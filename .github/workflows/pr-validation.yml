name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: maheshk172

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          ALL_SERVICES=(
            "cml-memoryhive-backend"
            "cml-memoryhive-frontend"
          )

          CHANGED_SERVICES=()
          for service in "${ALL_SERVICES[@]}"; do
            if echo "$CHANGED_FILES" | grep -q "^$service/"; then
              CHANGED_SERVICES+=("\"$service\"")
            fi
          done

          if echo "$CHANGED_FILES" | grep -qE "^((cml-memoryhive-backend|cml-memoryhive-frontend)/|cml-memoryhive-build/|cml-memoryhive-deployments/|pyproject\.toml|requirements\.txt|\.github/workflows/)"; then
            echo "Build-critical files changed, building all services"
            SERVICES_JSON=$(printf '%s\n' "${ALL_SERVICES[@]}" | jq -R . | jq -s .)
          elif [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "No service changes detected"
            SERVICES_JSON='[]'
          else
            SERVICES_JSON="[$(IFS=,; echo \"${CHANGED_SERVICES[*]}\")]"
          fi

          echo "services=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          if [ "$SERVICES_JSON" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Services to validate: $SERVICES_JSON"

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Dockerfile path and build args
        id: dockerfile
        run: |
          if [ "${{ matrix.service }}" = "cml-memoryhive-backend" ]; then
            echo "context=./${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "file=./${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args=" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.service }}" = "cml-memoryhive-frontend" ]; then
            SUPPORT_EMAIL="${{ vars.VITE_SUPPORT_EMAIL }}"
            if [ -z "$SUPPORT_EMAIL" ]; then
              SUPPORT_EMAIL='support@memoryhive.example.com'
            fi
            echo "context=./${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "file=./${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
            echo "VITE_API_URL=/api/v1" >> "$GITHUB_OUTPUT"
            echo "VITE_SUPPORT_EMAIL=$SUPPORT_EMAIL" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown service: ${{ matrix.service }}" >&2
            exit 1
          fi

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          push: false
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            ${{ steps.dockerfile.outputs.build_args }}

      - name: Build success
        run: echo "Docker image built successfully for ${{ matrix.service }}"

  pr-summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR**: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch**: ${{ github.head_ref }} → ${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.detect-changes.outputs.has_changes }}" = "true" ]; then
            echo "### Services Validated" >> "$GITHUB_STEP_SUMMARY"
            echo '${{ needs.detect-changes.outputs.services }}' | jq -r '.[] | "- " + .' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No service changes detected in this PR." >> "$GITHUB_STEP_SUMMARY"
          fi
