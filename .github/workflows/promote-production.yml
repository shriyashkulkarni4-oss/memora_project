name: Promote Production

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.12.13", python-version: "3.14", enable-cache: true }
      - run: uv sync --locked
      - uses: azure/setup-kubectl@v5
      - name: Copy exact staging pins to production
        run: |
          uv run python cml-memoryhive-deployments/scripts/promote_images.py production
          for profile in infra app-only full temporal; do
            uv run python cml-memoryhive-deployments/scripts/manage.py generate production "$profile"
            uv run python cml-memoryhive-deployments/scripts/manage.py validate production "$profile" --deployment-ready --kubectl-dry-run
          done
          uv run python -m unittest discover -s cml-memoryhive-deployments/tests -p 'test_*.py'
      - uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: promotion/production-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore: promote staging images to production [skip ci]"
          title: "chore: promote staging images to production"
          body: "Protected production promotion using the exact immutable images currently pinned in staging."
          add-paths: |
            cml-memoryhive-deployments/image-versions.json
            cml-memoryhive-deployments/generated/production/**
