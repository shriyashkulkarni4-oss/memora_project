name: Promote Production

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Copy exact staging pins to production
        run: |
          python3 cml-memoryhive-deployments/scripts/promote_images.py production
          for profile in infra app-only full temporal; do
            python3 cml-memoryhive-deployments/scripts/manage.py generate production "$profile"
          done
          python3 -m unittest discover -s cml-memoryhive-deployments/tests -p 'test_*.py'
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: promotion/production-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore: promote staging images to production [skip ci]"
          title: "chore: promote staging images to production"
          body: "Protected production promotion using the exact immutable images currently pinned in staging."
          add-paths: |
            cml-memoryhive-deployments/image-versions.json
            cml-memoryhive-deployments/generated/production/**
