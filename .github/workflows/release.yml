name: Release Containers and Promote Staging

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  publish-and-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { version: "0.12.13", python-version: "3.14", enable-cache: true }
      - run: uv sync --locked
      - uses: azure/setup-kubectl@v5
      - name: Validate release configuration
        env:
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
        run: |
          if ! printf '%s' "$VITE_SUPPORT_EMAIL" | grep -Eq '^[^@]+@[^@]+\.[^@]+$'; then
            echo "Set VITE_SUPPORT_EMAIL to the public support address." >&2
            exit 1
          fi
          if printf '%s' "$VITE_SUPPORT_EMAIL" | grep -Eq '(^|[.@])example\.'; then
            echo "VITE_SUPPORT_EMAIL must not use an example domain." >&2
            exit 1
          fi
      - name: Validate registry-driven build runtime
        run: make -C cml-memoryhive-build validate
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push canonical images
        env:
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
        run: >-
          uv run python cml-memoryhive-build/build/scripts/build_images.py
          --version "${{ github.ref_name }}"
          --sha "${{ github.sha }}"
          --registry docker.io
          --namespace maheshk172
          --push
      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: docker.io/maheshk172/cml-memoryhive-backend:${{ github.ref_name }}-${{ steps.vars.outputs.short_sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: docker.io/maheshk172/cml-memoryhive-frontend:${{ github.ref_name }}-${{ steps.vars.outputs.short_sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate immutable build manifest
        run: >-
          uv run python cml-memoryhive-build/build/scripts/generate_image_manifest.py
          --version "${{ github.ref_name }}"
          --sha "${{ github.sha }}"
          --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-artifact@v7
        with:
          name: cml-memoryhive-image-versions
          path: cml-memoryhive-build/build/output/image-versions.json
      - name: Promote immutable pins to staging
        run: |
          uv run python cml-memoryhive-deployments/scripts/promote_images.py staging --manifest cml-memoryhive-build/build/output/image-versions.json
          for profile in infra app-only full temporal; do
            uv run python cml-memoryhive-deployments/scripts/manage.py generate staging "$profile"
            uv run python cml-memoryhive-deployments/scripts/manage.py validate staging "$profile" --deployment-ready --kubectl-dry-run
          done
          uv run python -m unittest discover -s cml-memoryhive-deployments/tests -p 'test_*.py'
      - uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: promotion/staging-${{ github.ref_name }}
          delete-branch: true
          commit-message: "chore: promote ${{ github.ref_name }} to staging [skip ci]"
          title: "chore: promote ${{ github.ref_name }} to staging"
          body: "Automated immutable-image promotion generated from `${{ github.sha }}`."
          add-paths: |
            cml-memoryhive-deployments/image-versions.json
            cml-memoryhive-deployments/generated/staging/**
