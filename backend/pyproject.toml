[project]
name = "memoryhive-backend"
version = "0.1.0"
description = "Memoryhive API backend for personal capture and recall"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "bcrypt==4.3.0",
    "boto3==1.43.87",
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "greenlet==3.3.2",
    "httpx==0.28.1",
    "langdetect==1.0.9",
    "Pillow==12.3.0",
    "prometheus-client==0.23.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "pytesseract==0.3.13",
    "redis==7.1.1",
    "sqlalchemy[asyncio]==2.0.52",
    "temporalio==1.32.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "black==25.12.0",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # FastAPI dependency markers intentionally use call defaults
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
