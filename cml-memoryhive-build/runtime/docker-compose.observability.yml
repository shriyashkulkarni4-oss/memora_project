        "OPENAI_COMPATIBLE_CHAT_MODELS": "${OPENAI_COMPATIBLE_CHAT_MODELS:-[]}",
        "OPENAI_COMPATIBLE_EMBEDDING_MODELS": "${OPENAI_COMPATIBLE_EMBEDDING_MODELS:-[]}",
        "OPENAI_COMPATIBLE_ALLOWED_HOSTS": "${OPENAI_COMPATIBLE_ALLOWED_HOSTS:-[]}",
