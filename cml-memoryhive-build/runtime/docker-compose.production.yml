name: cml-memoryhive-production

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  APP_DEBUG: "false"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET}
  MINIO_SECURE: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  CORS_ORIGINS: '${CORS_ORIGINS:?Set CORS_ORIGINS}'
  ALLOWED_HOSTS: '${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}'
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
  AI_SUMMARIZATION_ROUTE: ${AI_SUMMARIZATION_ROUTE:-}
  AI_SUMMARIZATION_FALLBACK_ROUTES: '${AI_SUMMARIZATION_FALLBACK_ROUTES:-[]}'
  AI_ENRICHMENT_ROUTE: ${AI_ENRICHMENT_ROUTE:-}
  AI_ENRICHMENT_FALLBACK_ROUTES: '${AI_ENRICHMENT_FALLBACK_ROUTES:-[]}'
  AI_EMBEDDINGS_ROUTE: ${AI_EMBEDDINGS_ROUTE:-}
  AI_EMBEDDINGS_FALLBACK_ROUTES: '${AI_EMBEDDINGS_FALLBACK_ROUTES:-[]}'
  AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-768}
  AI_EMBEDDING_NORMALIZATION: ${AI_EMBEDDING_NORMALIZATION:-l2}
  AI_EMBEDDING_INDEX_VERSION: ${AI_EMBEDDING_INDEX_VERSION:-1}
  AI_EMBEDDING_CHUNK_CHARACTERS: ${AI_EMBEDDING_CHUNK_CHARACTERS:-2000}
  AI_EMBEDDING_CHUNK_OVERLAP: ${AI_EMBEDDING_CHUNK_OVERLAP:-200}
  AI_EMBEDDING_BACKFILL_BATCH_SIZE: ${AI_EMBEDDING_BACKFILL_BATCH_SIZE:-25}
  AI_EMBEDDING_BACKFILL_MAX_ITEMS_PER_MINUTE: ${AI_EMBEDDING_BACKFILL_MAX_ITEMS_PER_MINUTE:-30}
  AI_RERANKING_ROUTE: ${AI_RERANKING_ROUTE:-}
  AI_RERANKING_FALLBACK_ROUTES: '${AI_RERANKING_FALLBACK_ROUTES:-[]}'
  AI_VISION_ROUTE: ${AI_VISION_ROUTE:-}
  AI_VISION_FALLBACK_ROUTES: '${AI_VISION_FALLBACK_ROUTES:-[]}'
  AI_CROSS_PROVIDER_FALLBACK_ENABLED: ${AI_CROSS_PROVIDER_FALLBACK_ENABLED:-false}
  AI_EXTERNAL_CONTENT_ALLOWED: ${AI_EXTERNAL_CONTENT_ALLOWED:-false}
  AI_ALLOWED_EXTERNAL_PROVIDERS: '${AI_ALLOWED_EXTERNAL_PROVIDERS:-[]}'
  AI_DAILY_REQUEST_BUDGET: ${AI_DAILY_REQUEST_BUDGET:-0}
  AI_MONTHLY_REQUEST_BUDGET: ${AI_MONTHLY_REQUEST_BUDGET:-0}
  AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-0}
  AI_MONTHLY_TOKEN_BUDGET: ${AI_MONTHLY_TOKEN_BUDGET:-0}
  AI_DAILY_COST_BUDGET_USD: ${AI_DAILY_COST_BUDGET_USD:-0}
  AI_MONTHLY_COST_BUDGET_USD: ${AI_MONTHLY_COST_BUDGET_USD:-0}
  AI_PER_USER_DAILY_REQUEST_QUOTA: ${AI_PER_USER_DAILY_REQUEST_QUOTA:-0}
  AI_PER_USER_MONTHLY_REQUEST_QUOTA: ${AI_PER_USER_MONTHLY_REQUEST_QUOTA:-0}
  AI_PER_USER_DAILY_TOKEN_QUOTA: ${AI_PER_USER_DAILY_TOKEN_QUOTA:-0}
  AI_PER_USER_MONTHLY_TOKEN_QUOTA: ${AI_PER_USER_MONTHLY_TOKEN_QUOTA:-0}
  N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
  N8N_API_KEY: ${N8N_API_KEY:-}
  N8N_SIGNING_SECRET: ${N8N_SIGNING_SECRET:-}
  N8N_DEPLOYMENT_TYPE: ${N8N_DEPLOYMENT_TYPE:-self_hosted}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-}
  OLLAMA_DEPLOYMENT_TYPE: ${OLLAMA_DEPLOYMENT_TYPE:-self_hosted}
  OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
  OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
  OPENROUTER_ALLOWED_MODELS: '${OPENROUTER_ALLOWED_MODELS:-[]}'
  HUGGINGFACE_ENABLED: ${HUGGINGFACE_ENABLED:-false}
  HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
  HUGGINGFACE_CHAT_MODEL: ${HUGGINGFACE_CHAT_MODEL:-}
  HUGGINGFACE_EMBEDDING_MODEL: ${HUGGINGFACE_EMBEDDING_MODEL:-}
  HUGGINGFACE_CHAT_MODELS: '${HUGGINGFACE_CHAT_MODELS:-[]}'
  HUGGINGFACE_EMBEDDING_MODELS: '${HUGGINGFACE_EMBEDDING_MODELS:-[]}'
  OPENAI_COMPATIBLE_ENABLED: ${OPENAI_COMPATIBLE_ENABLED:-false}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
  OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
  OPENAI_COMPATIBLE_EMBEDDING_MODEL: ${OPENAI_COMPATIBLE_EMBEDDING_MODEL:-}
  OPENAI_COMPATIBLE_ALLOWED_HOSTS: '${OPENAI_COMPATIBLE_ALLOWED_HOSTS:-[]}'
  TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-false}
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal.example.internal:7233}
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}
  TEMPORAL_SCHEDULER_POLL_SECONDS: ${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}
  TEMPORAL_SCHEDULER_BATCH_SIZE: ${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}
  WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9101}
  TEMPORAL_SDK_METRICS_PORT: ${TEMPORAL_SDK_METRICS_PORT:-9102}
  TEMPORAL_SCHEDULER_METRICS_PORT: ${TEMPORAL_SCHEDULER_METRICS_PORT:-9103}
  TEMPORAL_WORKER_METRICS_PORT: ${TEMPORAL_WORKER_METRICS_PORT:-9104}

services:
  db:
    image: postgres:15.19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cml-memoryhive-backend:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    build:
      context: ../../cml-memoryhive-backend
      target: production
    command: ["sh", "-c", "uv run --frozen --no-sync alembic upgrade head && exec uv run --frozen --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*"]
    environment: *backend-environment
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--header", "Host: cml-memoryhive-backend", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cml-memoryhive-worker:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "app.worker"]
    environment: *backend-environment
    depends_on:
      cml-memoryhive-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-sync", "python", "-c", "import pathlib,sys; sys.exit(0 if b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cml-memoryhive-temporal-worker:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "app.temporal_pipeline.worker"]
    environment:
      <<: *backend-environment
      TEMPORAL_ENABLED: "true"
    depends_on:
      cml-memoryhive-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-sync", "python", "-c", "import pathlib,sys; sys.exit(0 if b'app.temporal_pipeline.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["temporal"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cml-memoryhive-temporal-scheduler:
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "app.temporal_pipeline.scheduler"]
    environment:
      <<: *backend-environment
      TEMPORAL_ENABLED: "true"
    depends_on:
      cml-memoryhive-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "uv", "run", "--frozen", "--no-sync", "python", "-c", "import pathlib,sys; sys.exit(0 if b'app.temporal_pipeline.scheduler' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles: ["temporal"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  cml-memoryhive-frontend:
    image: ${FRONTEND_IMAGE:?Set immutable FRONTEND_IMAGE}
    build:
      context: ../../cml-memoryhive-frontend
      target: production
      args:
        VITE_API_URL: /api/v1
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:?Set VITE_SUPPORT_EMAIL}
    depends_on:
      cml-memoryhive-backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cml-memoryhive-frontend: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../../ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      cml-memoryhive-backend: { condition: service_healthy }
    profiles: ["observability"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
  prometheus_data:
