{
  "name": "cml-memoryhive",
  "services": {
    "db": {
      "container_name": "cml-memoryhive-db",
      "image": "postgres:15-alpine",
      "environment": {
        "POSTGRES_USER": "${POSTGRES_USER:-memoryhive}",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:-memoryhive123}",
        "POSTGRES_DB": "${POSTGRES_DB:-memoryhive}"
      },
      "ports": [
        "${POSTGRES_PORT:-5432}:5432"
      ],
      "volumes": [
        "pgdata:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 10
      },
      "restart": "unless-stopped"
    },
    "redis": {
      "container_name": "cml-memoryhive-redis",
      "image": "redis:7-alpine",
      "command": [
        "redis-server",
        "--save",
        "60",
        "1",
        "--loglevel",
        "warning"
      ],
      "ports": [
        "${REDIS_PORT:-6379}:6379"
      ],
      "volumes": [
        "redisdata:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 10
      },
      "restart": "unless-stopped"
    },
    "minio": {
      "container_name": "cml-memoryhive-minio",
      "image": "minio/minio:latest",
      "command": [
        "server",
        "/data",
        "--console-address",
        ":9001"
      ],
      "environment": {
        "MINIO_ROOT_USER": "${MINIO_ROOT_USER:-minioadmin}",
        "MINIO_ROOT_PASSWORD": "${MINIO_ROOT_PASSWORD:-minioadmin123}"
      },
      "ports": [
        "${MINIO_API_PORT:-9000}:9000",
        "${MINIO_CONSOLE_PORT:-9001}:9001"
      ],
      "volumes": [
        "miniodata:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:9000/minio/health/ready"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      },
      "restart": "unless-stopped"
    },
    "temporal-db": {
      "container_name": "cml-memoryhive-temporal-db",
      "image": "postgres:15-alpine",
      "environment": {
        "POSTGRES_USER": "temporal",
        "POSTGRES_PASSWORD": "temporal"
      },
      "volumes": [
        "temporal_pgdata:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U temporal"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "restart": "unless-stopped"
    },
    "temporal": {
      "container_name": "cml-memoryhive-temporal",
      "image": "temporalio/auto-setup:${TEMPORAL_VERSION:-latest}",
      "environment": {
        "DB": "postgres12",
        "DB_PORT": "5432",
        "POSTGRES_USER": "temporal",
        "POSTGRES_PWD": "temporal",
        "POSTGRES_SEEDS": "temporal-db",
        "DYNAMIC_CONFIG_FILE_PATH": "config/dynamicconfig/development-sql.yaml"
      },
      "ports": [
        "${TEMPORAL_PORT:-7233}:7233"
      ],
      "volumes": [
        "../../ops/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro"
      ],
      "depends_on": {
        "temporal-db": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped"
    },
    "temporal-ui": {
      "container_name": "cml-memoryhive-temporal-ui",
      "image": "temporalio/ui:${TEMPORAL_UI_VERSION:-latest}",
      "environment": {
        "TEMPORAL_ADDRESS": "temporal:7233",
        "TEMPORAL_CORS_ORIGINS": "http://localhost:${FRONTEND_PORT:-3000}"
      },
      "ports": [
        "${TEMPORAL_UI_PORT:-8088}:8080"
      ],
      "depends_on": {
        "temporal": {
          "condition": "service_started"
        }
      },
      "restart": "unless-stopped"
    },
    "cml-memoryhive-backend": {
      "container_name": "cml-memoryhive-backend",
      "image": "docker.io/maheshk172/cml-memoryhive-backend:local",
      "build": {
        "context": "../../cml-memoryhive-backend",
        "dockerfile": "Dockerfile",
        "target": "development"
      },
      "command": [
        "uv",
        "run",
        "--frozen",
        "--no-sync",
        "uvicorn",
        "app.main:app",
        "--reload",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "environment": {
        "ENVIRONMENT": "development",
        "APP_DEBUG": "true",
        "DATABASE_URL": "${DATABASE_URL:-postgresql+asyncpg://memoryhive:memoryhive123@db:5432/memoryhive}",
        "REDIS_URL": "${REDIS_URL:-redis://redis:6379/0}",
        "MINIO_ENDPOINT": "${MINIO_ENDPOINT:-minio:9000}",
        "MINIO_ACCESS_KEY": "${MINIO_ROOT_USER:-minioadmin}",
        "MINIO_SECRET_KEY": "${MINIO_ROOT_PASSWORD:-minioadmin123}",
        "MINIO_BUCKET": "${MINIO_BUCKET:-memoryhive-uploads}",
        "MINIO_SECURE": "false",
        "JWT_SECRET_KEY": "${JWT_SECRET_KEY:-dev-secret-key-change-before-production}",
        "JWT_ALGORITHM": "${JWT_ALGORITHM:-HS256}",
        "ACCESS_TOKEN_EXPIRE_MINUTES": "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}",
        "REFRESH_TOKEN_EXPIRE_DAYS": "${REFRESH_TOKEN_EXPIRE_DAYS:-30}",
        "ENCRYPTION_KEY": "${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}",
        "CORS_ORIGINS": "${CORS_ORIGINS:-[\"http://localhost:3000\"]}",
        "TEMPORAL_ENABLED": "false",
        "TEMPORAL_ADDRESS": "${TEMPORAL_ADDRESS:-temporal:7233}",
        "TEMPORAL_NAMESPACE": "${TEMPORAL_NAMESPACE:-default}",
        "TEMPORAL_TASK_QUEUE": "${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}",
        "TEMPORAL_SCHEDULER_POLL_SECONDS": "${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}",
        "TEMPORAL_SCHEDULER_BATCH_SIZE": "${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}",
        "N8N_WEBHOOK_URL": "${N8N_WEBHOOK_URL:-}",
        "N8N_API_KEY": "${N8N_API_KEY:-}",
        "OLLAMA_BASE_URL": "${OLLAMA_BASE_URL:-}",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-qwen2.5:3b}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        },
        "minio": {
          "condition": "service_healthy"
        },
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "volumes": [
        "../../cml-memoryhive-backend:/app"
      ],
      "restart": "unless-stopped",
      "ports": [
        "${BACKEND_PORT:-8000}:8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8000/health/ready"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      }
    },
    "cml-memoryhive-worker": {
      "container_name": "cml-memoryhive-worker",
      "image": "docker.io/maheshk172/cml-memoryhive-backend:local",
      "build": {
        "context": "../../cml-memoryhive-backend",
        "dockerfile": "Dockerfile",
        "target": "development"
      },
      "command": [
        "uv",
        "run",
        "--frozen",
        "--no-sync",
        "python",
        "-m",
        "app.worker"
      ],
      "environment": {
        "ENVIRONMENT": "development",
        "APP_DEBUG": "true",
        "DATABASE_URL": "${DATABASE_URL:-postgresql+asyncpg://memoryhive:memoryhive123@db:5432/memoryhive}",
        "REDIS_URL": "${REDIS_URL:-redis://redis:6379/0}",
        "MINIO_ENDPOINT": "${MINIO_ENDPOINT:-minio:9000}",
        "MINIO_ACCESS_KEY": "${MINIO_ROOT_USER:-minioadmin}",
        "MINIO_SECRET_KEY": "${MINIO_ROOT_PASSWORD:-minioadmin123}",
        "MINIO_BUCKET": "${MINIO_BUCKET:-memoryhive-uploads}",
        "MINIO_SECURE": "false",
        "JWT_SECRET_KEY": "${JWT_SECRET_KEY:-dev-secret-key-change-before-production}",
        "JWT_ALGORITHM": "${JWT_ALGORITHM:-HS256}",
        "ACCESS_TOKEN_EXPIRE_MINUTES": "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}",
        "REFRESH_TOKEN_EXPIRE_DAYS": "${REFRESH_TOKEN_EXPIRE_DAYS:-30}",
        "ENCRYPTION_KEY": "${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}",
        "CORS_ORIGINS": "${CORS_ORIGINS:-[\"http://localhost:3000\"]}",
        "TEMPORAL_ENABLED": "false",
        "TEMPORAL_ADDRESS": "${TEMPORAL_ADDRESS:-temporal:7233}",
        "TEMPORAL_NAMESPACE": "${TEMPORAL_NAMESPACE:-default}",
        "TEMPORAL_TASK_QUEUE": "${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}",
        "TEMPORAL_SCHEDULER_POLL_SECONDS": "${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}",
        "TEMPORAL_SCHEDULER_BATCH_SIZE": "${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}",
        "N8N_WEBHOOK_URL": "${N8N_WEBHOOK_URL:-}",
        "N8N_API_KEY": "${N8N_API_KEY:-}",
        "OLLAMA_BASE_URL": "${OLLAMA_BASE_URL:-}",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-qwen2.5:3b}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "minio": {
          "condition": "service_healthy"
        },
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "volumes": [
        "../../cml-memoryhive-backend:/app"
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "uv",
          "run",
          "--frozen",
          "--no-sync",
          "python",
          "-c",
          "import pathlib,sys; sys.exit(0 if b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 3
      }
    },
    "cml-memoryhive-temporal-worker": {
      "container_name": "cml-memoryhive-temporal-worker",
      "image": "docker.io/maheshk172/cml-memoryhive-backend:local",
      "build": {
        "context": "../../cml-memoryhive-backend",
        "dockerfile": "Dockerfile",
        "target": "development"
      },
      "command": [
        "uv",
        "run",
        "--frozen",
        "--no-sync",
        "python",
        "-m",
        "app.temporal_pipeline.worker"
      ],
      "environment": {
        "ENVIRONMENT": "development",
        "APP_DEBUG": "true",
        "DATABASE_URL": "${DATABASE_URL:-postgresql+asyncpg://memoryhive:memoryhive123@db:5432/memoryhive}",
        "REDIS_URL": "${REDIS_URL:-redis://redis:6379/0}",
        "MINIO_ENDPOINT": "${MINIO_ENDPOINT:-minio:9000}",
        "MINIO_ACCESS_KEY": "${MINIO_ROOT_USER:-minioadmin}",
        "MINIO_SECRET_KEY": "${MINIO_ROOT_PASSWORD:-minioadmin123}",
        "MINIO_BUCKET": "${MINIO_BUCKET:-memoryhive-uploads}",
        "MINIO_SECURE": "false",
        "JWT_SECRET_KEY": "${JWT_SECRET_KEY:-dev-secret-key-change-before-production}",
        "JWT_ALGORITHM": "${JWT_ALGORITHM:-HS256}",
        "ACCESS_TOKEN_EXPIRE_MINUTES": "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}",
        "REFRESH_TOKEN_EXPIRE_DAYS": "${REFRESH_TOKEN_EXPIRE_DAYS:-30}",
        "ENCRYPTION_KEY": "${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}",
        "CORS_ORIGINS": "${CORS_ORIGINS:-[\"http://localhost:3000\"]}",
        "TEMPORAL_ENABLED": "true",
        "TEMPORAL_ADDRESS": "${TEMPORAL_ADDRESS:-temporal:7233}",
        "TEMPORAL_NAMESPACE": "${TEMPORAL_NAMESPACE:-default}",
        "TEMPORAL_TASK_QUEUE": "${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}",
        "TEMPORAL_SCHEDULER_POLL_SECONDS": "${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}",
        "TEMPORAL_SCHEDULER_BATCH_SIZE": "${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}",
        "N8N_WEBHOOK_URL": "${N8N_WEBHOOK_URL:-}",
        "N8N_API_KEY": "${N8N_API_KEY:-}",
        "OLLAMA_BASE_URL": "${OLLAMA_BASE_URL:-}",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-qwen2.5:3b}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "minio": {
          "condition": "service_healthy"
        },
        "temporal": {
          "condition": "service_started"
        },
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "volumes": [
        "../../cml-memoryhive-backend:/app"
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "uv",
          "run",
          "--frozen",
          "--no-sync",
          "python",
          "-c",
          "import pathlib,sys; sys.exit(0 if b'app.temporal_pipeline.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 3
      }
    },
    "cml-memoryhive-temporal-scheduler": {
      "container_name": "cml-memoryhive-temporal-scheduler",
      "image": "docker.io/maheshk172/cml-memoryhive-backend:local",
      "build": {
        "context": "../../cml-memoryhive-backend",
        "dockerfile": "Dockerfile",
        "target": "development"
      },
      "command": [
        "uv",
        "run",
        "--frozen",
        "--no-sync",
        "python",
        "-m",
        "app.temporal_pipeline.scheduler"
      ],
      "environment": {
        "ENVIRONMENT": "development",
        "APP_DEBUG": "true",
        "DATABASE_URL": "${DATABASE_URL:-postgresql+asyncpg://memoryhive:memoryhive123@db:5432/memoryhive}",
        "REDIS_URL": "${REDIS_URL:-redis://redis:6379/0}",
        "MINIO_ENDPOINT": "${MINIO_ENDPOINT:-minio:9000}",
        "MINIO_ACCESS_KEY": "${MINIO_ROOT_USER:-minioadmin}",
        "MINIO_SECRET_KEY": "${MINIO_ROOT_PASSWORD:-minioadmin123}",
        "MINIO_BUCKET": "${MINIO_BUCKET:-memoryhive-uploads}",
        "MINIO_SECURE": "false",
        "JWT_SECRET_KEY": "${JWT_SECRET_KEY:-dev-secret-key-change-before-production}",
        "JWT_ALGORITHM": "${JWT_ALGORITHM:-HS256}",
        "ACCESS_TOKEN_EXPIRE_MINUTES": "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}",
        "REFRESH_TOKEN_EXPIRE_DAYS": "${REFRESH_TOKEN_EXPIRE_DAYS:-30}",
        "ENCRYPTION_KEY": "${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}",
        "CORS_ORIGINS": "${CORS_ORIGINS:-[\"http://localhost:3000\"]}",
        "TEMPORAL_ENABLED": "true",
        "TEMPORAL_ADDRESS": "${TEMPORAL_ADDRESS:-temporal:7233}",
        "TEMPORAL_NAMESPACE": "${TEMPORAL_NAMESPACE:-default}",
        "TEMPORAL_TASK_QUEUE": "${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}",
        "TEMPORAL_SCHEDULER_POLL_SECONDS": "${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}",
        "TEMPORAL_SCHEDULER_BATCH_SIZE": "${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}",
        "N8N_WEBHOOK_URL": "${N8N_WEBHOOK_URL:-}",
        "N8N_API_KEY": "${N8N_API_KEY:-}",
        "OLLAMA_BASE_URL": "${OLLAMA_BASE_URL:-}",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-qwen2.5:3b}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "temporal": {
          "condition": "service_started"
        },
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "volumes": [
        "../../cml-memoryhive-backend:/app"
      ],
      "restart": "unless-stopped",
      "healthcheck": {
        "test": [
          "CMD",
          "uv",
          "run",
          "--frozen",
          "--no-sync",
          "python",
          "-c",
          "import pathlib,sys; sys.exit(0 if b'app.temporal_pipeline.scheduler' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 3
      }
    },
    "cml-memoryhive-frontend": {
      "container_name": "cml-memoryhive-frontend",
      "image": "docker.io/maheshk172/cml-memoryhive-frontend:local",
      "build": {
        "context": "../../cml-memoryhive-frontend",
        "dockerfile": "Dockerfile",
        "target": "development"
      },
      "command": [
        "npm",
        "run",
        "dev",
        "--",
        "--host",
        "0.0.0.0",
        "--port",
        "3000"
      ],
      "environment": {
        "VITE_API_URL": "${VITE_API_URL:-/api/v1}",
        "VITE_SUPPORT_EMAIL": "${VITE_SUPPORT_EMAIL:-support@memoryhive.example.com}",
        "VITE_PROXY_TARGET": "http://cml-memoryhive-backend:8000"
      },
      "ports": [
        "${FRONTEND_PORT:-3000}:3000"
      ],
      "depends_on": {
        "cml-memoryhive-backend": {
          "condition": "service_started"
        }
      },
      "volumes": [
        "../../cml-memoryhive-frontend:/app",
        "frontend_node_modules:/app/node_modules"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:3000/"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 10
      },
      "restart": "unless-stopped"
    },
    "migrate": {
      "container_name": "cml-memoryhive-migrate",
      "image": "docker.io/maheshk172/cml-memoryhive-backend:local",
      "build": {
        "context": "../../cml-memoryhive-backend",
        "dockerfile": "Dockerfile",
        "target": "development"
      },
      "command": [
        "uv",
        "run",
        "--frozen",
        "--no-sync",
        "alembic",
        "upgrade",
        "head"
      ],
      "environment": {
        "ENVIRONMENT": "development",
        "APP_DEBUG": "true",
        "DATABASE_URL": "${DATABASE_URL:-postgresql+asyncpg://memoryhive:memoryhive123@db:5432/memoryhive}",
        "REDIS_URL": "${REDIS_URL:-redis://redis:6379/0}",
        "MINIO_ENDPOINT": "${MINIO_ENDPOINT:-minio:9000}",
        "MINIO_ACCESS_KEY": "${MINIO_ROOT_USER:-minioadmin}",
        "MINIO_SECRET_KEY": "${MINIO_ROOT_PASSWORD:-minioadmin123}",
        "MINIO_BUCKET": "${MINIO_BUCKET:-memoryhive-uploads}",
        "MINIO_SECURE": "false",
        "JWT_SECRET_KEY": "${JWT_SECRET_KEY:-dev-secret-key-change-before-production}",
        "JWT_ALGORITHM": "${JWT_ALGORITHM:-HS256}",
        "ACCESS_TOKEN_EXPIRE_MINUTES": "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}",
        "REFRESH_TOKEN_EXPIRE_DAYS": "${REFRESH_TOKEN_EXPIRE_DAYS:-30}",
        "ENCRYPTION_KEY": "${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}",
        "CORS_ORIGINS": "${CORS_ORIGINS:-[\"http://localhost:3000\"]}",
        "TEMPORAL_ENABLED": "false",
        "TEMPORAL_ADDRESS": "${TEMPORAL_ADDRESS:-temporal:7233}",
        "TEMPORAL_NAMESPACE": "${TEMPORAL_NAMESPACE:-default}",
        "TEMPORAL_TASK_QUEUE": "${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}",
        "TEMPORAL_SCHEDULER_POLL_SECONDS": "${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}",
        "TEMPORAL_SCHEDULER_BATCH_SIZE": "${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}",
        "N8N_WEBHOOK_URL": "${N8N_WEBHOOK_URL:-}",
        "N8N_API_KEY": "${N8N_API_KEY:-}",
        "OLLAMA_BASE_URL": "${OLLAMA_BASE_URL:-}",
        "OLLAMA_MODEL": "${OLLAMA_MODEL:-qwen2.5:3b}"
      },
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        "../../cml-memoryhive-backend:/app"
      ],
      "restart": "no"
    }
  },
  "volumes": {
    "pgdata": {},
    "redisdata": {},
    "miniodata": {},
    "temporal_pgdata": {},
    "frontend_node_modules": {}
  },
  "networks": {
    "default": {
      "name": "cml-memoryhive-network"
    }
  }
}
