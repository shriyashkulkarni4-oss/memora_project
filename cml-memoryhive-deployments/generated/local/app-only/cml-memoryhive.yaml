apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "cml-memoryhive-backend"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "cml-memoryhive-backend"
  namespace: "cml-memoryhive-local"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "cml-memoryhive"
      app.kubernetes.io/component: "cml-memoryhive-backend"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "cml-memoryhive-backend"
    spec:
      serviceAccountName: "cml-memoryhive-backend"
      automountServiceAccountToken: false
      containers:
        - name: "cml-memoryhive-backend"
          image: "cml-memoryhive-backend:local"
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - configMapRef:
                name: "cml-memoryhive-backend-config"
            - secretRef:
                name: "cml-memoryhive-backend-secrets"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          command:
            - "uv"
            - "run"
            - "--frozen"
            - "--no-sync"
            - "uvicorn"
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "2"
            - "--proxy-headers"
            - "--forwarded-allow-ips=*"
          ports:
            - name: "http"
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: "http"
              httpHeaders:
                - name: "Host"
                  value: "memoryhive.local"
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: "/health/live"
              port: "http"
              httpHeaders:
                - name: "Host"
                  value: "memoryhive.local"
            periodSeconds: 30
      initContainers:
        - name: "migrate"
          image: "cml-memoryhive-backend:local"
          imagePullPolicy: "IfNotPresent"
          command:
            - "uv"
            - "run"
            - "--frozen"
            - "--no-sync"
            - "alembic"
            - "upgrade"
            - "head"
          envFrom:
            - configMapRef:
                name: "cml-memoryhive-backend-config"
            - secretRef:
                name: "cml-memoryhive-backend-secrets"
---
apiVersion: "apps/v1"
