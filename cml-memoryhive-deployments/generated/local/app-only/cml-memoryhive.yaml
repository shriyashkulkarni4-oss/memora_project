    cert-manager.io/cluster-issuer: "selfsigned"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "memoryhive.local"
      secretName: "cml-memoryhive-tls"
  rules:
    - host: "memoryhive.local"
      http:
        paths:
          - path: "/api/v1"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-backend"
                port:
                  number: 8000
          - path: "/health"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-backend"
                port:
                  number: 8000
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-frontend"
                port:
                  number: 80
---
