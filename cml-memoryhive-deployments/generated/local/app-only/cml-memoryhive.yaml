      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "cml-memoryhive-worker"
    spec:
      serviceAccountName: "cml-memoryhive-worker"
      automountServiceAccountToken: false
      containers:
        - name: "cml-memoryhive-worker"
          image: "cml-memoryhive-backend:local"
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - configMapRef:
                name: "cml-memoryhive-worker-config"
            - secretRef:
                name: "cml-memoryhive-worker-secrets"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "1Gi"
          command:
            - "uv"
            - "run"
            - "--frozen"
            - "--no-sync"
            - "python"
            - "-m"
            - "app.worker"
          livenessProbe:
            exec:
              command:
                - "uv"
                - "run"
                - "--frozen"
                - "--no-sync"
                - "python"
                - "-c"
                - "import pathlib,sys; sys.exit(0 if b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            periodSeconds: 30
---
