apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "cml-memoryhive"
  namespace: "cml-memoryhive-staging"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "staging.memoryhive.example.com"
      secretName: "cml-memoryhive-tls"
  rules:
    - host: "staging.memoryhive.example.com"
      http:
        paths:
          - path: "/api/v1"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-backend"
                port:
                  number: 8000
          - path: "/health"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-backend"
                port:
                  number: 8000
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-frontend"
                port:
