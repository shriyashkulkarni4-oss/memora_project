    pods: "40"
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: "cml-memoryhive-defaults"
  namespace: "cml-memoryhive-staging"
spec:
