apiVersion: v1
kind: Service
metadata:
  name: "db"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "db"
  namespace: "cml-memoryhive-staging"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "db"
  ports:
    - name: "tcp"
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "db"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "db"
  namespace: "cml-memoryhive-staging"
spec:
  serviceName: "db"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "cml-memoryhive"
      app.kubernetes.io/component: "db"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "db"
    spec:
      containers:
        - name: "postgres"
          image: "postgres:15-alpine"
          ports:
            - name: "postgres"
              containerPort: 5432
          env:
            - name: "POSTGRES_USER"
              valueFrom:
                secretKeyRef:
                  name: "cml-memoryhive-infra-secrets"
                  key: "POSTGRES_USER"
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "cml-memoryhive-infra-secrets"
                  key: "POSTGRES_PASSWORD"
            - name: "POSTGRES_DB"
              valueFrom:
                secretKeyRef:
                  name: "cml-memoryhive-infra-secrets"
                  key: "POSTGRES_DB"
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            periodSeconds: 10
          volumeMounts:
            - name: "pgdata"
              mountPath: "/var/lib/postgresql/data"
  volumeClaimTemplates:
    - metadata:
        name: "pgdata"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "20Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: "redis"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "redis"
  namespace: "cml-memoryhive-staging"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "redis"
  ports:
    - name: "tcp"
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "redis"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "redis"
  namespace: "cml-memoryhive-staging"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "cml-memoryhive"
      app.kubernetes.io/component: "redis"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "redis"
    spec:
      containers:
        - name: "redis"
          image: "redis:7-alpine"
          command:
            - "redis-server"
            - "--save"
            - "60"
            - "1"
            - "--loglevel"
            - "warning"
          ports:
            - name: "redis"
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 10
          volumeMounts:
            - name: "redisdata"
              mountPath: "/data"
      volumes:
        - name: "redisdata"
          emptyDir: {}
---
