spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "cml-memoryhive-backend"
  ports:
    - name: "http"
      port: 8000
      targetPort: "http"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "cml-memoryhive-backend"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "cml-memoryhive-backend"
  namespace: "cml-memoryhive-staging"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "cml-memoryhive"
      app.kubernetes.io/component: "cml-memoryhive-backend"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "cml-memoryhive-backend"
    spec:
      serviceAccountName: "cml-memoryhive-backend"
      automountServiceAccountToken: false
      containers:
        - name: "cml-memoryhive-backend"
          image: "ghcr.io/coding-monkey-labs-client-projects/cml-memoryhive-backend:v0.0.0-0000000"
          imagePullPolicy: "Always"
          envFrom:
            - configMapRef:
                name: "cml-memoryhive-backend-config"
            - secretRef:
                name: "cml-memoryhive-backend-secrets"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          command:
            - "uv"
            - "run"
            - "--frozen"
            - "--no-sync"
            - "uvicorn"
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "2"
            - "--proxy-headers"
            - "--forwarded-allow-ips=*"
          ports:
            - name: "http"
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: "http"
              httpHeaders:
                - name: "Host"
                  value: "staging.memoryhive.example.com"
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: "/health/live"
              port: "http"
              httpHeaders:
                - name: "Host"
                  value: "staging.memoryhive.example.com"
            periodSeconds: 30
      initContainers:
        - name: "migrate"
          image: "ghcr.io/coding-monkey-labs-client-projects/cml-memoryhive-backend:v0.0.0-0000000"
          imagePullPolicy: "Always"
          command:
            - "uv"
            - "run"
            - "--frozen"
            - "--no-sync"
            - "alembic"
            - "upgrade"
            - "head"
          envFrom:
            - configMapRef:
                name: "cml-memoryhive-backend-config"
            - secretRef:
                name: "cml-memoryhive-backend-secrets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "cml-memoryhive-worker"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "cml-memoryhive-worker"
  namespace: "cml-memoryhive-staging"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "cml-memoryhive"
      app.kubernetes.io/component: "cml-memoryhive-worker"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "cml-memoryhive-worker"
    spec:
      serviceAccountName: "cml-memoryhive-worker"
      automountServiceAccountToken: false
      containers:
        - name: "cml-memoryhive-worker"
          image: "ghcr.io/coding-monkey-labs-client-projects/cml-memoryhive-backend:v0.0.0-0000000"
          imagePullPolicy: "Always"
          envFrom:
            - configMapRef:
                name: "cml-memoryhive-worker-config"
            - secretRef:
                name: "cml-memoryhive-worker-secrets"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          command:
            - "uv"
            - "run"
            - "--frozen"
            - "--no-sync"
            - "python"
            - "-m"
            - "app.worker"
          livenessProbe:
            exec:
              command:
                - "uv"
                - "run"
                - "--frozen"
                - "--no-sync"
                - "python"
                - "-c"
                - "import pathlib,sys; sys.exit(0 if b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"
            periodSeconds: 30
---
