  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "minio"
  namespace: "cml-memoryhive-staging"
spec:
  type: "ClusterIP"
  selector:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "minio"
  ports:
