---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "cml-memoryhive"
  namespace: "cml-memoryhive-staging"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "staging.memoryhive.example.com"
      secretName: "cml-memoryhive-tls"
  rules:
    - host: "staging.memoryhive.example.com"
      http:
        paths:
          - path: "/api/v1"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-backend"
                port:
                  number: 8000
          - path: "/health"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-backend"
                port:
                  number: 8000
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "cml-memoryhive-frontend"
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "cml-memoryhive-default-deny-ingress"
  namespace: "cml-memoryhive-staging"
spec:
  podSelector:
    {}
  policyTypes:
    - "Ingress"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "cml-memoryhive-allow-same-namespace-ingress"
  namespace: "cml-memoryhive-staging"
spec:
  podSelector:
    {}
  policyTypes:
    - "Ingress"
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "cml-memoryhive-allow-ingress-controller"
  namespace: "cml-memoryhive-staging"
spec:
  podSelector:
    matchExpressions:
      - key: "app.kubernetes.io/component"
        operator: "In"
        values:
          - "cml-memoryhive-backend"
          - "cml-memoryhive-frontend"
  policyTypes:
    - "Ingress"
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "ingress-nginx"
      ports:
        - protocol: "TCP"
          port: 80
        - protocol: "TCP"
          port: 8000
