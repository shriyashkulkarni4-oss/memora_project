      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "minio"
  labels:
    app.kubernetes.io/name: "cml-memoryhive"
    app.kubernetes.io/component: "minio"
  namespace: "cml-memoryhive-staging"
spec:
  serviceName: "minio"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: "cml-memoryhive"
      app.kubernetes.io/component: "minio"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "cml-memoryhive"
        app.kubernetes.io/component: "minio"
    spec:
      containers:
        - name: "minio"
          image: "minio/minio:latest"
          command:
            - "minio"
            - "server"
            - "/data"
          ports:
            - name: "http"
              containerPort: 9000
          env:
            - name: "MINIO_ROOT_USER"
              valueFrom:
                secretKeyRef:
                  name: "cml-memoryhive-infra-secrets"
                  key: "MINIO_ROOT_USER"
            - name: "MINIO_ROOT_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "cml-memoryhive-infra-secrets"
                  key: "MINIO_ROOT_PASSWORD"
          readinessProbe:
            httpGet:
              path: "/minio/health/ready"
              port: "http"
            periodSeconds: 15
          volumeMounts:
            - name: "miniodata"
              mountPath: "/data"
  volumeClaimTemplates:
    - metadata:
        name: "miniodata"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "50Gi"
