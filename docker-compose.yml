name: memoryhive

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memoryhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memoryhive123}
      POSTGRES_DB: ${POSTGRES_DB:-memoryhive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memoryhive}:${POSTGRES_PASSWORD:-memoryhive123}@db:5432/${POSTGRES_DB:-memoryhive}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-before-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memoryhive}:${POSTGRES_PASSWORD:-memoryhive123}@db:5432/${POSTGRES_DB:-memoryhive}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-memoryhive-uploads}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-before-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-long!}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-false}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}
      TEMPORAL_SCHEDULER_POLL_SECONDS: ${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}
      TEMPORAL_SCHEDULER_BATCH_SIZE: ${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memoryhive}:${POSTGRES_PASSWORD:-memoryhive123}@db:5432/${POSTGRES_DB:-memoryhive}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-memoryhive-uploads}
      MINIO_SECURE: "false"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      TEMPORAL_ENABLED: ${TEMPORAL_ENABLED:-false}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}
      TEMPORAL_SCHEDULER_POLL_SECONDS: ${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}
      TEMPORAL_SCHEDULER_BATCH_SIZE: ${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if b'app.worker' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@memoryhive.example.com}
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  temporal-db:
    image: postgres:15-alpine
    profiles: ["temporal"]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-latest}
    profiles: ["temporal"]
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    volumes:
      - ./ops/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-latest}
    profiles: ["temporal"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    depends_on:
      - temporal
    restart: unless-stopped

  temporal-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: ["python", "-m", "app.temporal_pipeline.worker"]
    profiles: ["temporal"]
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memoryhive}:${POSTGRES_PASSWORD:-memoryhive123}@db:5432/${POSTGRES_DB:-memoryhive}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-memoryhive-uploads}
      MINIO_SECURE: "false"
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  temporal-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: ["python", "-m", "app.temporal_pipeline.scheduler"]
    profiles: ["temporal"]
    environment:
      ENVIRONMENT: development
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memoryhive}:${POSTGRES_PASSWORD:-memoryhive123}@db:5432/${POSTGRES_DB:-memoryhive}
      TEMPORAL_ENABLED: "true"
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-memoryhive-analysis}
      TEMPORAL_SCHEDULER_POLL_SECONDS: ${TEMPORAL_SCHEDULER_POLL_SECONDS:-10}
      TEMPORAL_SCHEDULER_BATCH_SIZE: ${TEMPORAL_SCHEDULER_BATCH_SIZE:-25}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      temporal:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  redisdata:
  temporal_pgdata:
  frontend_node_modules:
