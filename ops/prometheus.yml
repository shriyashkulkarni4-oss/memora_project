global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cml-memoryhive-api
    metrics_path: /metrics
    static_configs:
      - targets: ["cml-memoryhive-backend:8000"]
  - job_name: cml-memoryhive-database-worker
    static_configs:
      - targets: ["cml-memoryhive-worker:9101"]
  - job_name: cml-memoryhive-temporal-sdk
    static_configs:
      - targets: ["cml-memoryhive-temporal-worker:9102"]
  - job_name: cml-memoryhive-temporal-scheduler
    static_configs:
      - targets: ["cml-memoryhive-temporal-scheduler:9103"]
  - job_name: cml-memoryhive-temporal-worker
    static_configs:
      - targets: ["cml-memoryhive-temporal-worker:9104"]
  - job_name: temporal-server
    static_configs:
      - targets: ["temporal:8000"]
